[package]
name = "agenthd"
version = "0.1.0"
edition = "2021"
description = "Terminal UI that manages OpenCode agent definitions and synchronizes them to the OpenCode config directory."
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tui-textarea = "0.7"

[dev-dependencies]
tempfile = "3"